# School AI Office — 本機驗證用最小設定（gitignored，不進 repo）
version: 1.3.17
cache: true

# Google Workspace 登入（操作步驟見 school-ai-office/GOOGLE-LOGIN.md）
registration:
  # 登入頁只顯示 Google 按鈕（還要在 .env 填 GOOGLE_CLIENT_ID／SECRET 並設 ALLOW_SOCIAL_LOGIN=true 才會出現）
  socialLogins: ['google']
  # 只允許學校網域的帳號註冊／登入：把下面兩行取消註解，換成學校 email @ 後面的網域。
  # 必須完全相符：老師是 t.example.edu.tw、學生是 st.example.edu.tw 的話，兩個都要列。
  # allowedDomains:
  #   - 'example.edu.tw'

interface:
  agents: true
  # 驗證 #1：開啟 Agents API（API key 以發 key 的教師身分執行）
  remoteAgents:
    use: true
    create: true
    share: true
    public: false

endpoints:
  agents:
    disableBuilder: false
  custom:
    # 生生有 Token（OpenAI-compatible）；金鑰由使用者自行填入 .env 的 NMKING_API_KEY
    - name: 'NMKing'
      apiKey: '${NMKING_API_KEY}'
      baseURL: 'https://ai.nmking.io/v1'
      models:
        # 2026-10-02 實測 /v1/models 只列出 gpt-5.6-luna
        default: ['gpt-5.6-luna']
        fetch: true
      # 2026-10-02 實測：生生有 chat/completions 的串流模式回
      # 「upstream returned non-JSON response」，Responses API 串流正常 → 強制走 Responses API
      addParams:
        useResponsesApi: true
      titleConvo: false
      # 與生生有官方 Codex 連線設定一致
      headers:
        x-openai-actor-authorization: 'local-image-extension'
        x-nmking-locale: 'zh-TW'
